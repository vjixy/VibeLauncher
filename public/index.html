<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Launcher</title>
    <meta name="description"
        content="Your personal launcher for vibe-coded apps. Manage, run, and open all your projects from one place.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="layout-wrapper">

        <!-- ── Sidebar ── -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="brand-icon">
                    <i class="ph-fill ph-rocket-launch"></i>
                </div>
                <div>
                    <div class="brand-name">VibeLauncher</div>
                    <div class="brand-sub">PROJECT HUB</div>
                </div>
            </div>
            <div class="sidebar-section">
                <div class="sidebar-section-label">Workspaces</div>
                <ul id="categoryList" class="category-list">
                    <li class="category-item active" onclick="filterByCategory('All')">
                        <i class="ph-bold ph-squares-four"></i>
                        All Projects
                        <span class="cat-count" id="cat-count-all">0</span>
                    </li>
                    <!-- injected via JS -->
                </ul>
            </div>
        </aside>

        <!-- ── Main ── -->
        <main class="container">
            <header class="app-header">
                <div class="header-left">
                    <h1 id="headerTitle">All Projects</h1>
                    <p id="headerSub">Your vibe-coded apps, all in one place</p>
                </div>
                <div class="header-actions">
                    <div class="search-box">
                        <i class="ph-bold ph-magnifying-glass"></i>
                        <input type="text" id="searchInput" placeholder="Search projects…" autocomplete="off">
                    </div>
                    <!-- Theme toggle -->
                    <button id="themeToggleBtn" class="theme-toggle" title="Toggle light / dark mode"
                        aria-label="Toggle theme">
                        <i class="ph-bold ph-sun" id="themeIcon"></i>
                    </button>
                    <button id="addProjectBtn" class="btn primary-btn">
                        <i class="ph-bold ph-plus"></i> New Project
                    </button>
                </div>
            </header>

            <div id="projectsGrid" class="projects-grid">
                <div class="loading-state">
                    <div class="spinner"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast container -->
    <div id="toast-container"></div>

    <!-- ── Modal: Add / Edit Project ── -->
    <div id="addModal" class="modal-overlay hidden">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">New Project</h2>
                <button id="closeModalBtn" class="icon-btn" aria-label="Close modal">
                    <i class="ph-bold ph-x"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="projectForm">
                    <input type="hidden" id="editProjectId" value="">

                    <div class="form-columns">
                        <!-- Left: Details -->
                        <div class="form-col">
                            <div class="form-group">
                                <label for="pName">Project Name</label>
                                <input type="text" id="pName" required placeholder="e.g. Magic App">
                            </div>
                            <div class="form-group">
                                <label for="pCategory">Category <span style="opacity:.45">(optional)</span></label>
                                <input type="text" id="pCategory" list="categoryOptions"
                                    placeholder="e.g. Work, Personal">
                                <datalist id="categoryOptions"><!-- Injected via JS --></datalist>
                            </div>
                            <div class="form-group">
                                <label for="pPath">Project Path</label>
                                <input type="text" id="pPath" required placeholder="C:\Users\you\Projects\MagicApp">
                            </div>
                            <div class="form-group">
                                <label for="pLogo">Logo URL <span style="opacity:.45">(optional)</span></label>
                                <input type="url" id="pLogo" placeholder="https://example.com/logo.png">
                            </div>
                            <div class="form-group">
                                <label for="pIde">IDE Command</label>
                                <input type="text" id="pIde" required placeholder="code, cursor, or windsurf">
                            </div>
                            <div class="form-group">
                                <label for="pNotes">Notes <span style="opacity:.45">(optional)</span></label>
                                <textarea id="pNotes"
                                    placeholder="What does this project do? Any useful reminders…"></textarea>
                            </div>
                        </div>

                        <!-- Right: Commands -->
                        <div class="form-col commands-col">
                            <div class="commands-header">
                                <h3>Run Commands</h3>
                                <button type="button" id="addCmdBtn" class="text-btn">
                                    <i class="ph-bold ph-plus"></i> Add
                                </button>
                            </div>
                            <div id="commandsList" class="commands-scrollable">
                                <!-- Commands added here -->
                            </div>
                        </div>
                    </div>

                    <div class="modal-actions">
                        <button type="button" id="cancelModalBtn" class="btn secondary-btn">Cancel</button>
                        <button type="submit" class="btn primary-btn">
                            <i class="ph-bold ph-floppy-disk"></i> Save Project
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
