<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="indigo" data-density="comfortable">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vibe Launcher</title>
<meta name="description" content="Launcher, MCP explorer, prompt library, and markdown workspace for vibe-coded projects.">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="app-shell min-h-screen flex">
  <aside id="sidebar" class="sidebar"></aside>
  <main class="flex-1 flex flex-col min-w-0">
    <header id="appHeader" class="app-header"></header>
    <section id="appContent" class="app-content">
      <div class="loading-state"><div class="spinner"></div></div>
    </section>
  </main>
</div>

<div id="drawerRoot"></div>
<div id="modalRoot"></div>
<div id="paletteRoot"></div>
<div id="toastRoot"></div>
<input id="fileUploadInput" type="file" accept=".md,text/markdown" multiple hidden>

<script type="module" src="main.js"></script>
</body>
</html>
