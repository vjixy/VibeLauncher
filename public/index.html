<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Launcher</title>
    <meta name="description" content="Launcher, MCP explorer, prompt library, and markdown workspace for vibe-coded projects.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="brand-icon"><i class="ph-fill ph-rocket-launch"></i></div>
                <div>
                    <div class="brand-name">Vibe Launcher</div>
                    <div class="brand-sub">Projects, MCP tools, prompts, markdown</div>
                </div>
            </div>

            <nav id="sectionNav" class="section-nav"></nav>

            <section class="sidebar-panel">
                <div class="sidebar-panel-header">
                    <div>
                        <div id="sidebarTitle" class="sidebar-section-label"></div>
                        <p id="sidebarSub" class="sidebar-section-copy"></p>
                    </div>
                    <button id="sidebarActionBtn" class="sidebar-add-btn hidden" type="button">
                        <i class="ph-bold ph-plus"></i>
                    </button>
                </div>
                <div id="sidebarPanel" class="sidebar-panel-body"></div>
            </section>
        </aside>

        <main class="main-shell">
            <header class="app-header">
                <div class="header-left">
                    <h1 id="headerTitle">Vibe Launcher</h1>
                    <p id="headerSub"></p>
                </div>

                <div class="header-actions">
                    <label class="search-box">
                        <i class="ph-bold ph-magnifying-glass"></i>
                        <input type="text" id="globalSearch" placeholder="Search">
                    </label>

                    <button id="themeToggleBtn" class="theme-toggle" aria-label="Toggle theme" type="button">
                        <i class="ph-bold ph-sun" id="themeIcon"></i>
                    </button>

                    <button id="primaryActionBtn" class="btn primary-btn" type="button"></button>
                </div>
            </header>

            <section id="sectionContent" class="section-content">
                <div class="loading-state">
                    <div class="spinner"></div>
                </div>
            </section>
        </main>
    </div>

    <div id="toast-container"></div>
    <input id="markdownUploadInput" type="file" accept=".md,text/markdown" multiple hidden>
    <div id="modalRoot"></div>

    <script type="module" src="app.js"></script>
</body>

</html>
